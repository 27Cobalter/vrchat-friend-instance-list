name: Release

on:
  push:
    tags: ['*-my.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '16.13.0'

      - run: npm ci
      - run: npm run build

      # Chrome(MV3)用manifestに差し替えてzip化
      - run: |
          cd build
          mv manifest-chrome.json manifest.json
          zip -r ../${{ github.event.repository.name }}-chrome-${{ github.ref_name }}.zip .

      - run: gh release create ${{ github.ref_name }} *-chrome-*.zip --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
